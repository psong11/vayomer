<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vayomer · petsi</title>
<style>
  :root{
    --bg:#0d1115; --panel:#151c22; --line:#232d36;
    --ink:#e4eaef; --dim:#7d8b96;
    --idle:#7d8b96; --listen:#43d6a0; --think:#e8b13d; --speak:#a688f5; --err:#ff7b72;
    --accent:var(--idle);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font:16px/1.55 ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex; flex-direction:column; align-items:center;
    padding:28px 20px 40px; gap:22px;
  }
  h1{
    font-size:13px; letter-spacing:.22em; text-transform:uppercase;
    color:var(--dim); font-weight:600; margin:0;
  }
  .stage{
    width:100%; max-width:640px; background:var(--panel);
    border:1px solid var(--line); border-radius:14px; padding:22px;
    display:flex; flex-direction:column; gap:18px; align-items:center;
  }
  canvas{width:100%; height:120px; display:block}
  .status{
    font:600 13px/1 ui-monospace,SFMono-Regular,Menlo,monospace;
    letter-spacing:.16em; text-transform:uppercase; color:var(--accent);
    transition:color .25s; min-height:14px;
  }
  button{
    appearance:none; border:0; cursor:pointer; font:600 17px/1 inherit;
    color:#0d1115; background:var(--accent); padding:16px 42px; border-radius:999px;
    transition:background .25s, transform .08s; letter-spacing:.01em;
  }
  button:hover{filter:brightness(1.08)}
  button:active{transform:scale(.97)}
  button:disabled{opacity:.5; cursor:not-allowed}
  button:focus-visible{outline:2px solid var(--ink); outline-offset:3px}
  .flowwrap{width:100%; max-width:640px; display:flex; flex-direction:column; gap:9px}
  .flow{display:flex; width:100%; overflow-x:auto; padding:2px 0 0}
  .node{
    flex:1 1 0; min-width:82px; display:flex; flex-direction:column;
    align-items:center; gap:5px; position:relative; text-align:center;
  }
  .node + .node::before{
    content:""; position:absolute; left:-50%; top:8px; width:100%; height:2px;
    background:var(--line); z-index:0;
  }
  .node[data-state="done"]::before{background:var(--listen)}
  .node[data-state="active"]::before{background:var(--accent)}
  .node[data-state="failed"]::before{background:var(--err)}
  .dot{
    width:18px; height:18px; border-radius:50%; background:var(--bg);
    border:2px solid var(--line); z-index:1; transition:background .2s,border-color .2s;
  }
  .node[data-remote="true"] .dot{border-style:dashed}
  .node[data-state="done"] .dot{background:var(--listen); border-color:var(--listen)}
  .node[data-state="active"] .dot{
    background:var(--accent); border-color:var(--accent);
    animation:pulse 1.1s ease-in-out infinite;
  }
  .node[data-state="failed"] .dot{background:var(--err); border-color:var(--err)}
  @keyframes pulse{
    0%,100%{box-shadow:0 0 0 0 color-mix(in srgb, var(--accent) 55%, transparent)}
    50%    {box-shadow:0 0 0 7px color-mix(in srgb, var(--accent) 0%, transparent)}
  }
  .nlab{
    font:600 9.5px/1 ui-monospace,Menlo,monospace; letter-spacing:.13em;
    text-transform:uppercase; color:var(--dim);
  }
  .node[data-state="active"] .nlab{color:var(--accent)}
  .node[data-state="done"] .nlab{color:var(--ink)}
  .ninfo{font:11px/1.25 ui-monospace,Menlo,monospace; color:var(--dim);
    max-width:96px; overflow-wrap:anywhere; min-height:14px}
  .ntime{font:600 11px/1 ui-monospace,Menlo,monospace; color:var(--listen);
    font-variant-numeric:tabular-nums; min-height:12px}
  .flownote{
    margin:0; text-align:center; font:10px/1 ui-monospace,Menlo,monospace;
    letter-spacing:.08em; color:var(--dim); opacity:.8;
  }
  .settings{
    width:100%; max-width:640px; display:grid;
    grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:10px;
  }
  .settings label{
    display:flex; flex-direction:column; gap:5px;
    font:600 10px/1 ui-monospace,Menlo,monospace; letter-spacing:.18em;
    text-transform:uppercase; color:var(--dim);
  }
  .settings select{
    appearance:none; width:100%; background:var(--panel); color:var(--ink);
    border:1px solid var(--line); border-radius:9px; padding:10px 12px;
    font:13px/1.2 ui-monospace,Menlo,monospace; cursor:pointer;
  }
  .settings select:hover{border-color:var(--dim)}
  .settings select:focus-visible{outline:2px solid var(--accent); outline-offset:1px}
  .io{width:100%; max-width:640px; display:flex; flex-direction:column; gap:12px}
  .card{
    background:var(--panel); border:1px solid var(--line); border-radius:12px;
    padding:15px 18px; display:none; flex-direction:column; gap:6px;
  }
  .card.on{display:flex}
  .card h2{
    margin:0; font:600 10px/1 ui-monospace,Menlo,monospace;
    letter-spacing:.2em; text-transform:uppercase; color:var(--dim);
  }
  .card p{margin:0; white-space:pre-wrap}
  .card.reply{border-left:3px solid var(--speak)}
  .card.err{border-left:3px solid var(--err)} .card.err p{color:var(--err)}
  .timings{
    font:11px/1.5 ui-monospace,Menlo,monospace; color:var(--dim);
    letter-spacing:.04em; text-align:center; min-height:16px; white-space:pre-line;
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
  <h1>vayomer · petsi</h1>

  <div class="stage">
    <canvas id="viz" width="1200" height="240" aria-hidden="true"></canvas>
    <div class="status" id="status">ready</div>
    <button id="btn">Start talking</button>
  </div>

  <div class="flowwrap">
    <div class="flow" id="flow" role="img" aria-label="Pipeline progress"></div>
    <p class="flownote">solid ring = runs on petsi · dashed ring = leaves the box</p>
  </div>

  <div class="settings">
    <label>Hearing<select id="m-whisper"></select></label>
    <label>Thinking<select id="m-claude"></select></label>
    <label>Voice<select id="m-voice"></select></label>
  </div>

  <div class="io">
    <div class="card" id="c-you"><h2>You said</h2><p id="you"></p></div>
    <div class="card reply" id="c-reply"><h2>Claude</h2><p id="reply"></p></div>
    <div class="card err" id="c-err"><h2>Problem</h2><p id="err"></p></div>
    <div class="timings" id="timings"></div>
  </div>

<script>
const btn=document.getElementById("btn"), statusEl=document.getElementById("status");
const cv=document.getElementById("viz"), ctx=cv.getContext("2d");
const N=88, IDLE=0.018, levels=new Array(N).fill(IDLE);
let recording=false, busy=false, accentVar="--idle";

const COLORS={idle:"--idle",listening:"--listen",converting:"--think",
              transcribing:"--think",thinking:"--think",speaking:"--speak",
              playing:"--speak"};

function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim();}

function draw(){
  const w=cv.width,h=cv.height,mid=h/2;
  ctx.clearRect(0,0,w,h);
  const bw=w/N, gap=bw*0.34;
  ctx.fillStyle=css(accentVar)||"#7d8b96";
  for(let i=0;i<N;i++){
    const v = Number.isFinite(levels[i]) ? levels[i] : IDLE;
    const bar=Math.max(3, v*(h*0.92));
    ctx.globalAlpha=0.35+0.65*Math.min(1,v*2.2);
    ctx.beginPath();
    const x=i*bw+gap/2, ww=bw-gap, r=Math.min(ww/2,3);
    ctx.roundRect(x, mid-bar/2, ww, bar, r);
    ctx.fill();
  }
  ctx.globalAlpha=1;
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);

const FLOW=[["capture","mic"],["convert","resample"],["whisper","whisper"],
            ["claude","claude"],["tts","voice"],["speaker","speaker"]];
const flowEl=document.getElementById("flow");
FLOW.forEach(([key,label])=>{
  const n=document.createElement("div");
  n.className="node"; n.id="n-"+key;
  n.dataset.state="pending"; n.dataset.remote="false";
  n.innerHTML='<div class="dot"></div><div class="nlab">'+label+
              '</div><div class="ninfo"></div><div class="ntime"></div>';
  flowEl.appendChild(n);
});
function renderFlow(stages){
  if(!stages) return;
  for(const [key] of FLOW){
    const sg=stages[key]; if(!sg) continue;
    const n=document.getElementById("n-"+key);
    n.dataset.state=sg.state;
    n.dataset.remote=sg.remote?"true":"false";
    n.querySelector(".ninfo").textContent=sg.info||"";
    n.querySelector(".ntime").textContent=(sg.t!=null&&sg.state==="done")?sg.t+"s":"";
  }
}

const es=new EventSource("/events");
es.onmessage=e=>{
  const d=JSON.parse(e.data);
  // Read the tail BEFORE shifting: after shift() index N-1 no longer exists, and
  // undefined*0.86 is NaN, which poisons the whole array and draws nothing.
  const tail = levels[levels.length - 1];
  levels.shift();
  const next = d.recording ? d.level : (Number.isFinite(tail) ? tail * 0.86 : IDLE);
  levels.push(Math.max(IDLE, Number.isFinite(next) ? next : IDLE));
  accentVar=COLORS[d.status]||"--idle";
  document.documentElement.style.setProperty("--accent", `var(${accentVar})`);
  renderFlow(d.stages);
  if(!busy || d.status!=="idle") statusEl.textContent=d.status==="idle"?"ready":d.status+"…";
};

function show(id,txt){
  const card=document.getElementById("c-"+id);
  document.getElementById(id).textContent=txt||"";
  card.classList.toggle("on", !!txt);
}

const SEL={whisper:"m-whisper", claude:"m-claude", voice:"m-voice"};
async function loadModels(){
  try{
    const m=await (await fetch("/models")).json();
    const fill=(key,items)=>{
      const el=document.getElementById(SEL[key]);
      el.innerHTML="";
      items.forEach(it=>{
        const o=document.createElement("option");
        o.value=it.id;
        o.textContent=it.label+(it.mb?`  ·  ${it.mb} MB`:"");
        if(it.id===m.active[key]) o.selected=true;
        el.appendChild(o);
      });
      el.onchange=async()=>{
        el.disabled=true;
        const r=await fetch("/config",{method:"POST",
          headers:{"Content-Type":"application/json"},
          body:JSON.stringify({[key]:el.value})});
        if(!r.ok){ const d=await r.json(); show("err",d.error||"could not switch"); }
        el.disabled=false;
      };
    };
    fill("whisper",m.whisper); fill("claude",m.claude); fill("voice",m.voices);
    if(m.notice) show("err", m.notice);
  }catch(e){ show("err","Could not load the model list: "+e.message); }
}
loadModels();

btn.onclick=async()=>{
  if(busy) return;
  if(!recording){
    show("you",""); show("reply",""); show("err","");
    document.getElementById("timings").textContent="";
    const r=await fetch("/start",{method:"POST"});
    if(!r.ok){show("err","Could not start the microphone.");return;}
    recording=true; btn.textContent="Stop and send";
  }else{
    recording=false; busy=true;
    btn.disabled=true; btn.textContent="Working…";
    try{
      const r=await fetch("/stop",{method:"POST"});
      const d=await r.json();
      show("you", d.transcript); show("reply", d.reply); show("err", d.error);
      if(d.timings&&d.timings.total){
        const t=d.timings, u=d.used||{};
        document.getElementById("timings").textContent=
          `whisper ${t.whisper}s · claude ${t.claude}s · tts ${t.tts}s · total ${t.total}s`
          + (u.claude? `\n${u.whisper} · ${u.claude} · ${u.voice}` : "");
      }
    }catch(err){ show("err","Request failed: "+err.message); }
    busy=false; btn.disabled=false; btn.textContent="Start talking";
    statusEl.textContent="ready";
  }
};
</script>
</body>
</html>
